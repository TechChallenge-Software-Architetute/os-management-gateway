name: CD

on:
  push:
    branches: [develop, main]

# develop -> homolog, main -> prod
jobs:
  deploy:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    concurrency:
      group: os-management-gateway-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      TF_VAR_origin_url: ${{ secrets.ORIGIN_URL }}
      TF_VAR_lambda_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=gateway/${TF_VAR_environment}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -var="aws_region=${{ env.AWS_REGION }}"

      - name: Show gateway URL
        run: |
          echo "auth endpoint: $(terraform output -raw auth_endpoint)"
