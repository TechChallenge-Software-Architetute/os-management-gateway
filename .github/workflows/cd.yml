name: CD

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Each branch has an isolated Terraform state and API Gateway environment.
jobs:
  deploy:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: os-management-gateway-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_environment: ${{ github.ref_name }}
      TF_VAR_origin_url: ${{ github.ref_name == 'main' && secrets.ORIGIN_URL_MAIN || secrets.ORIGIN_URL }}
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      # Activates the provider account guard (allowed_account_ids). Org-level secret,
      # selected by branch (main->MAIN, develop->DEVELOP); empty = no restriction.
      TF_VAR_aws_account_id: ${{ github.ref_name == 'main' && secrets.AWS_ACCOUNT_ID_MAIN || secrets.AWS_ACCOUNT_ID_DEVELOP }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform state bucket config
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "TF_STATE_BUCKET is not configured. Set repository variable TF_STATE_BUCKET or secret TF_STATE_BUCKET."
            exit 1
          fi

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=gateway/${TF_VAR_environment}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -var="aws_region=${AWS_REGION}"

      - name: Show gateway URL
        run: |
          echo "auth endpoint: $(terraform output -raw auth_endpoint)"
