name: CD

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

# develop -> homolog, main -> prod
jobs:
  deploy:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    concurrency:
      group: os-management-gateway-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_environment: shared
      TF_VAR_origin_url: ${{ secrets.ORIGIN_URL }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET }}
      TF_VAR_lambda_state_bucket: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform state bucket config
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "TF_STATE_BUCKET is not configured. Set repository variable TF_STATE_BUCKET or secret TF_STATE_BUCKET."
            exit 1
          fi

      - name: Check Lambda remote state availability
        id: lambda_state
        run: |
          LAMBDA_STATE_KEY="lambda/shared/terraform.tfstate"

          if aws s3api head-object \
            --bucket "${TF_VAR_lambda_state_bucket}" \
            --key "$LAMBDA_STATE_KEY" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "State do Lambda encontrado: s3://${TF_VAR_lambda_state_bucket}/${LAMBDA_STATE_KEY}"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::State do Lambda não encontrado em s3://${TF_VAR_lambda_state_bucket}/${LAMBDA_STATE_KEY}."
          fi

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=gateway/shared/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: terraform apply \
          -auto-approve \
          -input=false \
          -var="aws_region=${AWS_REGION}"

      - name: Show gateway URL
        run: |
          echo "auth endpoint: $(terraform output -raw auth_endpoint)"

      - name: Skip deploy when Lambda state is missing
        if: steps.lambda_state.outputs.available != 'true'
        run: echo "Deploy ignorado porque o state remoto do Lambda ainda não existe."
