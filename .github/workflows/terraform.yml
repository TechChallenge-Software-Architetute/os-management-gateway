name: Deploy API Gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: os-management-gateway-terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: Provision API Gateway
    runs-on: ubuntu-latest

    # Do not print these values. Terraform automatically reads TF_VAR_* vars.
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_origin_url: ${{ secrets.OS_MANAGEMENT_ORIGIN_URL }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=os-management-gateway/terraform.tfstate" \
            -backend-config="region=$TF_VAR_aws_region" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Show gateway URL
        working-directory: terraform
        run: |
          echo "API Gateway URL: $(terraform output -raw invoke_url)"
